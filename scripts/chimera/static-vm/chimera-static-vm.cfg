# CHIMERA static-analysis domU. No network device: dom0 talks to it only through hot-plugged raw disks and
# xenstore (drakrun/analyzer/static/vm_backend.py). Root disk read-only; scratch disk reformatted at boot.
name = "chimera-static"
type = "pvh"
kernel = "/var/lib/chimera-static-vm/vmlinuz"
ramdisk = "/var/lib/chimera-static-vm/initrd.img"
cmdline = "root=/dev/xvda ro console=hvc0 quiet systemd.show_status=0 panic=10"
memory = 3584
maxmem = 3584
vcpus = 2
vif = []
disk = [
    "format=raw,vdev=xvda,access=ro,backendtype=phy,target=/var/lib/chimera-static-vm/root.img",
    "format=raw,vdev=xvde,access=rw,backendtype=phy,target=/var/lib/chimera-static-vm/scratch.img",
]
on_poweroff = "destroy"
on_reboot = "restart"
on_crash = "destroy"
